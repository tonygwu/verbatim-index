    "transcript": "[00:00:01.06]  Welcome back to The Long Build. I&#39;m Rosa Ferreira, and today my guest is Idris Okonkwo, who runs a company that builds batteries for the grid and has done so for eleven years.  [00:00:14.40]  Thanks for having me, Rosa. It&#39;s good to be back, and I promise we&#39;re going to build something bigger this decade than anything we built in the last one.  [00:00:27.81]  Let&#39;s start there. You said &quot;patient capital&quot; on stage last week. What does that phrase mean for a hardware company that has to pour concrete before it sees revenue?  [00:00:41.02]  It means our investors accept margins &lt; 10 percent for the first plant. The second plant is where the learning curve pays, because the line we copy is already debugged and the crews already know it.  [00:00:58.37]  And R&amp;D? A lot of founders cut research first when money is tight. You went the other way and doubled the lab while the market was falling.  [00:01:10.55]  We doubled R&amp;D because chemistry is the moat. Anyone can buy cells. Very few people can make a cell last twenty years on a grid that cycles it twice a day in the desert heat.  [00:01:26.14]  Give me a number I can hold you to. People on this show make a lot of promises and I like to check them later.  [00:01:34.90]  By the end of 2027 our storage will cost less than a new gas peaker plant in most of the western grid. I&#39;d put that at better than even odds, and I&#39;ll be disappointed if we miss it.  [00:01:52.23]  That is a specific claim. What would have to go wrong for you to miss it? Walk me through the failure cases you actually worry about.  [00:02:01.48]  Interconnection queues. The grid operator decides when we plug in, not us. If the queue stays at four years, the cost curve doesn&#39;t matter because nobody gets to use the cheap batteries.  [00:02:18.75]  So the bottleneck isn&#39;t the battery at all. It&#39;s paperwork and transformers and a queue that nobody owns.  [00:02:26.30]  Exactly. Transformers are the quiet crisis. Lead times went from one year to three, and a battery that can&#39;t connect is a very expensive paperweight sitting in a field.  [00:02:41.12]  Let&#39;s talk about the people side. How do you hire for a factory in a town that has never had a factory?  [00:02:49.66]  You train. We run a twelve week program with the community college, and we pay people while they learn. About eighty percent of the first class still works for us today.  [00:03:04.09]  What surprised you most in the first year of running the plant, once the ribbon cutting was over and the cameras left?  [00:03:12.44]  How much the weather matters. Humidity changes the coating line, so we built a model that adjusts the ovens every hour. That one change raised our yield more than any new machine.  [00:03:28.83]  You&#39;ve been critical of subsidies before. Is that still your view now that your competitors are collecting them and building faster?  [00:03:38.17]  My view is that subsidies should pay for outcomes, not for announcements. Pay per megawatt hour delivered and you&#39;ll see who is real and who is only running a press office.  [00:03:53.60]  Where does the company go after storage? Do you stay a battery company, or does the grid pull you into something else?  [00:04:02.91]  I think within five years we&#39;ll sell software that schedules the whole fleet, and the batteries will become the smaller part of the business. The data from every site is what compounds.  [00:04:18.26]  That&#39;s a bold forecast for a company that started out making cells in a rented garage with three people and a loan.  [00:04:27.70]  It is. But every company I admire made the jump from product to platform, and the ones that didn&#39;t got priced like commodities and then got bought for their parking lots.  [00:04:41.35]  Before we go, one question I ask everyone. What do you believe about energy that most people in your industry would disagree with?  [00:04:50.02]  That demand
